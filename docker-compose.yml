services:
  backend:
    build: .
    image: ${BACKEND_IMAGE:-stylenow-backend:local}
    restart: unless-stopped
    env_file:
      - path: .env
        required: false
    ports:
      - "${HOST_PORT:-${PORT:-3000}}:${PORT:-3000}"
    environment:
      PORT: ${PORT:-3000}
      APP_VERSION: ${APP_VERSION:-0.0.1}
